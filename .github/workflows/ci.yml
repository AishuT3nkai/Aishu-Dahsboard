name: Dashboard CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Report dependency audit findings
        run: |
          npm audit --json > /tmp/npm-audit.json || true
          node -e 'const fs = require("fs"); const audit = JSON.parse(fs.readFileSync("/tmp/npm-audit.json", "utf8")); for (const [name, item] of Object.entries(audit.vulnerabilities || {})) { const via = (item.via || []).filter((entry) => typeof entry === "object").map((entry) => `${entry.title} [${entry.range}] ${entry.url}`).join("; "); console.log(`${name}: severity=${item.severity}, direct=${item.isDirect}, range=${item.range}, fixAvailable=${JSON.stringify(item.fixAvailable)}, advisories=${via}`); }
      - name: ESLint
        run: npm run lint
      - name: TypeScript check
        run: npm run typecheck
      - name: Production build
        run: npm run build
